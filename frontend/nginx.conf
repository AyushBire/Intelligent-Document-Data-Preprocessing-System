map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;

    # Keep in sync with MAX_UPLOAD_SIZE_MB
    client_max_body_size 21m;

    root /usr/share/nginx/html;
    index index.html;

    # Interim protection until app-level auth exists. Serve this over HTTPS only.
    auth_basic           "IDPS";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Health endpoint for load balancers / uptime checks (no auth)
    location = /health {
        auth_basic off;
        proxy_pass http://backend:8000/health;
    }

    # REST API (keeps the /api prefix)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket job progress
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Hashed build assets: cache hard
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback (React Router)
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
