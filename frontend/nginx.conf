server {
    listen 80;
    server_name _;

    # Keep in sync with MAX_UPLOAD_SIZE_MB
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Interim protection until app-level auth exists. Serve this over HTTPS only.
    auth_basic           "IDPS";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Health endpoint for load balancers / uptime checks (no auth)
    location = /health {
        auth_basic off;
        proxy_pass http://backend:8000/health;
    }

    # REST API (keeps the /api prefix)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket job progress
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Hashed build assets: cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (React Router)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
