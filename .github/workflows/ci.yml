name: IDPS validation
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: docker build -t idps-web .
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idps
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: idps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idps -d idps"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_API_KEY: test-key
      PRELOAD_MODELS: "false"
      DATABASE_URL: postgresql+asyncpg://idps:ci-only-password@localhost:5432/idps
      TEST_POSTGRES_URL: postgresql+asyncpg://idps:ci-only-password@localhost:5432/idps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest
      - run: alembic downgrade base
      - run: docker build -t idps-api .
