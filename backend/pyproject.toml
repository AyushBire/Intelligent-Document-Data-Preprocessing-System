[project]
name = "idps-cloud-api"
version = "1.0.0"
description = "Stateless document processing API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn==0.32.1",
  "python-multipart==0.0.17",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "pydantic-settings==2.6.1",
  "python-dotenv==1.0.1",
  "google-generativeai==0.8.3",
  "Pillow==11.0.0",
]

[project.scripts]
app = "main:app"

[tool.vercel.scripts]
build = "alembic upgrade head"
