services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: idps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: idps
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idps -d idps"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: idps
      POSTGRES_DB: idps
      AUTO_CREATE_TABLES: "false"
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ocr_models:/home/idps/.EasyOCR
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 5
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./deploy/.htpasswd:/etc/nginx/.htpasswd:ro
volumes:
  pgdata:
  uploads:
  ocr_models:
